      <text x="76" y="92" fill="#79c0ff"># NovaDesk 智能客服项目周报 · W34</text>
      <text x="76" y="120"></text>
      <text x="76" y="148" fill="#8b949e">周期：2026.08.17—2026.08.21 ｜ Owner：林澈 ｜ 状态：按计划推进</text>
      <text x="76" y="176"></text>
      <text x="76" y="204" fill="#79c0ff">## 本周结论</text>
      <text x="76" y="232"></text>
      <text x="76" y="260">- 核心链路已灰度到 30%，本周 P0 事故 0 起。</text>
      <text x="76" y="288">- 自动解决率从 31.2% 提升到 38.6%，超过 35% 的阶段目标。</text>
      <text x="76" y="316">- iOS 登录成功率下降到 98.9%，等待新版 SDK 修复。</text>
      <text x="76" y="344"></text>
      <text x="76" y="372" fill="#79c0ff">## 关键指标</text>
      <text x="76" y="400"></text>
      <text x="76" y="428" fill="#a5d6ff">| 指标 | 目标 | 上周 | 本周 | 状态 |</text>
      <text x="76" y="456" fill="#8b949e">| --- | ---: | ---: | ---: | --- |</text>
      <text x="76" y="484">| 自动解决率 | ≥35% | 31.2% | 38.6% | 达标 |</text>
      <text x="76" y="512">| 平均首次响应 | ≤2 分钟 | 2 分 43 秒 | 1 分 36 秒 | 达标 |</text>
      <text x="76" y="540">| 知识库命中率 | ≥80% | 74.8% | 82.1% | 达标 |</text>
      <text x="76" y="568">| iOS 登录成功率 | ≥99.5% | 99.6% | 98.9% | 风险 |</text>
      <text x="76" y="596"></text>
      <text x="76" y="624" fill="#79c0ff">## 本周完成</text>
