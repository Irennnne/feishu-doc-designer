  <rect x="792" y="237" width="194" height="12" rx="6" fill="#B0B5BD"/>
  <text x="734" y="311" fill="#1F2329" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Background</text>
  <rect x="734" y="331" width="348" height="11" rx="5.5" fill="#C9CDD4"/>
